# TS-027: networkd non deve spazzare le ip rule che non ha creato lui.
# Le rule 1201-1206 (sorgente DHCP -> VPS) le scrive mpquic-policy-routing.sh:
# con il default (yes) sparivano a ogni riconfigurazione di link, lasciando le
# pipe UDP senza percorso -> sendmsg EPERM e reconnect storm (misurato su mpq4,
# 18 eventi in 2 minuti, 81% di loss ICMP nel tunnel).
[Network]
ManageForeignRoutingPolicyRules=no
