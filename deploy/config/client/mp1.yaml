# Multipath stripe client — single Starlink path
# FEC adaptive + ARQ for Starlink resilience
role: client
multipath_enabled: true
multipath_policy: balanced
tun_name: mp1
tun_cidr: 10.200.17.1/24
metrics_listen: auto
log_level: info
tls_ca_file: /etc/mpquic/tls/ca.crt
tls_server_name: mpquic-server
tls_insecure_skip_verify: false
congestion_algorithm: bbr
transport_mode: reliable
stripe_port: 46017
stripe_data_shards: 10
stripe_parity_shards: 2
stripe_fec_mode: adaptive
stripe_fec_type: rs
stripe_fec_window: 10
stripe_arq: true
# ── Fast failover health-check (default mostrati, opzionali) ──
# stripe_fast_keepalive_interval: 1s
# stripe_path_degraded_threshold: 3s
# stripe_path_degraded_recovery: 1s
# stripe_health_check_interval: 500ms
multipath_paths:
- name: wan6
  bind_ip: if:enp7s8
  remote_addr: VPS_PUBLIC_IP
  remote_port: 45017
  priority: 1
  weight: 1
  pipes: 12
  transport: stripe
